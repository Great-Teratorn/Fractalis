
# ============================================================
# FRACTALIS — Python package configuration
# ============================================================
# This file defines how our project is installed, which
# libraries it needs, and how we run its automated tests.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalis"
version = "0.1.0"
description = "A mathematical fractal exploration and visualization engine"
readme = "README.md"
requires-python = ">=3.12"

# Core scientific and visualization dependencies.
dependencies = [
    "numpy>=2.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "streamlit>=1.40",
    "streamlit-plotly-events2>=0.0.7",
    "plotly>=5.0",
]

# Tools used during development and testing.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# This will let us run FRACTALIS from the terminal later.
# We will create cli.py before using this command.
[project.scripts]
fractalis = "fractalis.cli:main"

# Our Python package lives inside src/.
[tool.setuptools.packages.find]
where = ["src"]

# Keep automated tests in one predictable location.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
